# Render Blueprint — deploy "MAUSAM" to a live URL in ~2 minutes.
# How to use: push this repo to GitHub, then in Render dashboard:
#   New +  →  Blueprint  →  connect this repo  →  Apply.
# You get a public URL like https://mausam-mvp.onrender.com
# NOTE: this is a fully key-less Python (FastAPI) backend — no API key required.

services:
  - type: web
    name: mausam-mvp
    runtime: python
    plan: free
    region: singapore
    healthCheckPath: /api/health
    buildCommand: cd client && npm install && npm run build && cd ../server && pip install -r requirements.txt
    startCommand: cd server && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENABLE_LIVE_IMD
        value: true